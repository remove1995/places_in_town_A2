dth=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 13V2l8 4-8 4\"/><path d=\"M20.561 10.222a9 9 0 1 1-12.55-5.29\"/><path d=\"M8.002 9.997a5 5 0 1 0 8.9 2.02\"/></g></svg>","swimming pool":"<svg viewBox=\"0 0 64 80\" aria-hidden=\"true\" focusable=\"false\"><path fill=\"currentColor\" d=\"M32 2C15.4 2 2 15.4 2 32c0 20 30 46 30 46s30-26 30-46C62 15.4 48.6 2 32 2z\"/><g transform=\"translate(18 18) scale(1.1667)\" fill=\"none\" stroke=\"white\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 5a2 2 0 0 0-2 2v11\"/><path d=\"M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1\"/><path d=\"M7 13h10\"/><path d=\"M7 9h10\"/><path d=\"M9 5a2 2 0 0 0-2 2v11\"/></g></svg>","theatre":"<svg viewBox=\"0 0 64 80\" aria-hidden=\"true\" focusable=\"false\"><path fill=\"currentColor\" d=\"M32 2C15.4 2 2 15.4 2 32c0 20 30 46 30 46s30-26 30-46C62 15.4 48.6 2 32 2z\"/><g transform=\"translate(18 18) scale(1.1667)\" fill=\"none\" stroke=\"white\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 11h.01\"/><path d=\"M14 6h.01\"/><path d=\"M18 6h.01\"/><path d=\"M6.5 13.1h.01\"/><path d=\"M22 5c0 9-4 12-6 12s-6-3-6-12c0-2 2-3 6-3s6 1 6 3\"/><path d=\"M17.4 9.9c-.8.8-2 .8-2.8 0\"/><path d=\"M10.1 7.1C9 7.2 7.7 7.7 6 8.6c-3.5 2-4.7 3.9-3.7 5.6 4.5 7.8 9.5 8.4 11.2 7.4.9-.5 1.9-2.1 1.9-4.7\"/><path d=\"M9.1 16.5c.3-1.1 1.4-1.7 2.4-1.4\"/></g></svg>"};
const places = ["art gallery", "cafe", "cinema", "gym", "library", "museum", "park", "restaurant", "shopping centre", "sports centre", "stadium", "swimming pool", "theatre"];
// Invented contribution counts belong to the game's fictional reviewers.
const contributorNotes = ["Local Guide \u00b7 28 reviews \u00b7 46 photos", "8 reviews \u00b7 3 photos", "1 review", "Local Guide \u00b7 112 reviews \u00b7 87 photos", "5 reviews \u00b7 2 photos", "Local Guide \u00b7 34 reviews \u00b7 19 photos", "3 reviews", "Local Guide \u00b7 67 reviews \u00b7 104 photos", "12 reviews \u00b7 6 photos", "Local Guide \u00b7 41 reviews \u00b7 23 photos", "9 reviews \u00b7 11 photos", "2 reviews \u00b7 1 photo", "Local Guide \u00b7 53 reviews \u00b7 38 photos"];
reviews.forEach((item,i)=>{item.place=places[i];item.note=contributorNotes[i];item.avatar='assets/avatar-'+String(i+1).padStart(2,'0')+'.webp';});
const $=id=>document.getElementById(id),card=$('card');
let deck=[],index=0,phase='hidden',busy=false;
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,reducedMotion.matches?0:ms));
// Preload the supplied effects. Audio is unlocked by the first card tap.
const AudioContextClass=window.AudioContext||window.webkitAudioContext;
let soundContext=null,soundUnlocked=false,soundActivation=Promise.resolve();
try{if(AudioContextClass)soundContext=new AudioContextClass();}catch{}
const soundBuffers={};
const soundReady=soundContext?Promise.all(['flip','magic'].map(async name=>{try{const response=await fetch('assets/'+name+'.m4a');if(!response.ok)return;const bytes=await response.arrayBuffer();soundBuffers[name]=await soundContext.decodeAudioData(bytes);}catch{}})):Promise.resolve();
function unlockSounds(){if(!soundContext)return;soundUnlocked=true;soundActivation=soundContext.resume().catch(()=>{});}
function playSound(name){if(!soundContext||!soundUnlocked)return;void Promise.all([soundReady,soundActivation]).then(()=>{if(soundContext.state!=='running'||!soundBuffers[name])return;const source=soundContext.createBufferSource();source.buffer=soundBuffers[name];const gain=soundContext.createGain();gain.gain.value=0.5;source.connect(gain);gain.connect(soundContext.destination);source.start();}).catch(()=>{});}
const starPath='<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9-6.2-3.3-6.2 3.3L7 14.2 2 9.3l6.9-1z"/>';
function shuffled(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
function progress(){$('progress').innerHTML=deck.map((_,i)=>'<span class="'+(i<index?'done':i===index?'current':'')+'"></span>').join('');$('progress').setAttribute('aria-valuenow',String(index));}
function setPhase(next){phase=next;card.dataset.phase=next;$('front').setAttribute('aria-hidden',String(next==='revealed'));$('cover').setAttribute('aria-hidden',String(next!=='hidden'));$('review').setAttribute('aria-hidden',String(next!=='revealed'));$('answer').setAttribute('aria-hidden',String(next!=='answered'));}
function showHidden(withSound=true){card.className='card resetting';card.hidden=false;card.disabled=false;setPhase('hidden');card.setAttribute('aria-label','Open mystery review '+(index+1)+' of '+deck.length);$('counter').textContent=(index+1)+' / '+deck.length;$('instruction').textContent='Tap to Reveal';for(const id of ['review-text','person','person-note','avatar','stars','date','answer-word','answer-icon'])$(id).replaceChildren();progress();void card.offsetWidth;card.classList.remove('resetting');if(withSound)playSound('magic');}
async function openReview(){if(busy||phase!=='hidden')return state();busy=true;card.disabled=true;playSound('flip');const item=deck[index];$('person').textContent=item.name;$('person-note').textContent=item.note;const portrait=document.createElement('img');portrait.src=item.avatar;portrait.alt='';portrait.width=57;portrait.height=57;$('avatar').replaceChildren(portrait);$('date').textContent=item.date;$('review-text').textContent=item.text;$('stars').innerHTML=Array.from({length:5},(_,i)=>'<svg viewBox="0 0 24 24" aria-hidden="true" class="'+(i<item.stars?'':'empty')+'">'+starPath+'</svg>').join('');$('stars').setAttribute('aria-label',item.stars+' out of 5 stars');setPhase('revealed');card.setAttribute('aria-label',item.name+'. '+item.text+' Tap to reveal the place.');$('instruction').textContent='Tap to Reveal';await wait(580);busy=false;card.disabled=false;return state();}
async function revealAnswer(){if(busy||phase!=='revealed')return state();busy=true;card.disabled=true;playSound('flip');const item=deck[index];$('answer-word').textContent=item.place;$('answer-icon').innerHTML=placeIcons[item.place];setPhase('answered');card.setAttribute('aria-label','The mystery place is '+item.place+'. Tap for the next review.');$('instruction').textContent='Tap for next review';await wait(580);busy=false;card.disabled=false;return state();}
async function dismissReview(){if(busy||phase!=='answered')return state();busy=true;card.disabled=true;playSound('flip');card.classList.add('flight');await wait(700);index++;progress();if(index===deck.length){phase='complete';card.hidden=true;$('complete').hidden=false;$('counter').textContent=deck.length+' / '+deck.length;$('instruction').textContent='Play again';$('restart').focus();}else{showHidden();card.disabled=true;card.classList.add('arriving');await wait(600);card.classList.remove('arriving');card.disabled=false;card.focus({preventScroll:true});}busy=false;return state();}
function restart(withSound=true){if(busy)return state();deck=shuffled(reviews);index=0;$('complete').hidden=true;showHidden(withSound);return state();}
function state(){return{phase,reviewNumber:Math.min(index+1,deck.length),total:deck.length,completed:index,busy,review:phase==='revealed'||phase==='answered'?deck[index].text:null,answer:phase==='answered'?deck[index].place:null};}
card.addEventListener('click',()=>{if(busy)return;unlockSounds();if(phase==='hidden')void openReview();else if(phase==='revealed')void revealAnswer();else if(phase==='answered')void dismissReview();});$('restart').addEventListener('click',()=>{unlockSounds();restart();card.focus({preventScroll:true});});restart(false);
if(document.modelContext?.registerTool){const lifecycle=new AbortController();for(const[name,description,readOnly,action]of[
['read_review_game_state','Read progress, the opened review and its answer only after the answer is revealed.',true,state],['open_mystery_review','Open the current hidden review.',false,openReview],['reveal_mystery_answer','Flip the open review and reveal the name of the place.',false,revealAnswer],['dismiss_open_review','Send away a card whose answer has been revealed and advance to the next hidden review.',false,dismissReview],['restart_review_game','Shuffle all 13 reviews and start again.',false,restart]
]){try{Promise.resolve(document.modelContext.registerTool({name,description,inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:readOnly,untrustedContentHint:false},execute:async input=>{if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new Error('Expected an empty object.');return action();}},{signal:lifecycle.signal})).catch(()=>{});}catch{}}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}
</script>
